<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · Appex</title><link rel="stylesheet" href="css/style.css"></head>
<body data-root="">
<div id="header"></div>
<main class="wrap">
  <div class="form-card">
    <h1 id="title">Create account</h1><p class="sub" id="sub">Join Appex and discover great apps</p>
    <div id="msg"></div>

    <div id="stepForm">
      <label>Full name</label><input id="name" type="text" autocomplete="name">
      <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="hint" id="inviteHint" hidden>This email comes from your invite and cannot be changed.</div>
      <label>Password (min 8 characters)</label><input id="password" type="password" autocomplete="new-password">
      <p style="margin-top:20px"><button class="btn" id="go">Create account</button></p>
    </div>

    <div id="stepVerify" hidden>
      <p class="hint" id="sentTo"></p>
      <label>Verification code</label>
      <input id="code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••">
      <p style="margin-top:20px"><button class="btn" id="verify">Verify &amp; continue</button></p>
      <p class="hint">You only verify once — next time just sign in with your password.</p>
      <p class="hint"><a class="link-btn" id="resend">Resend code</a> · <a class="link-btn" id="change">Change details</a></p>
    </div>

    <p class="hint" style="margin-top:18px">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script>
renderHeader(null, 'login');
const $ = id => document.getElementById(id), msg = $('msg');
const invite = qs('invite');          // developer invite token (only an admin can create one)
let email = '';

async function done() {
  const p = await getProfile();
  if (!p) { await sb.auth.signOut(); return flash(msg, 'This account is not allowed to sign in.'); }
  location.href = homeFor(p.role);
}

/* Developer invite link: validate it and lock the email field */
const ready = (async () => {
  if (!invite) return;
  const { data, error } = await sb.rpc('check_invite', { p_token: invite });
  if (error || !data) {
    $('stepForm').hidden = true; $('title').textContent = 'Invite not valid';
    $('sub').textContent = 'This developer invite link is invalid, expired or already used. Please ask the admin for a new one.';
    return;
  }
  $('title').textContent = 'Developer sign-up'; $('sub').textContent = 'You were invited to publish apps on Appex';
  $('email').value = data; $('email').readOnly = true; $('inviteHint').hidden = false;
})();

$('go').onclick = async () => {
  await ready;
  email = $('email').value.trim().toLowerCase();
  const full_name = $('name').value.trim(), password = $('password').value;
  if (!full_name) return flash(msg, 'Please enter your name.');
  if (!validEmail(email)) return flash(msg, 'Enter a valid email address.');
  if (password.length < 8) return flash(msg, 'Password must be at least 8 characters.');
  $('go').disabled = true; flash(msg, '');
  const meta = invite ? { full_name, invite_token: invite } : { full_name };
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: meta } });
  $('go').disabled = false;
  if (error) return flash(msg, AUTH.friendly(error));
  // Supabase hides "already registered" by returning a user without identities
  if (data.user && data.user.identities && data.user.identities.length === 0)
    return flash(msg, 'This email is already registered. Please sign in.');
  if (data.session) return done();                       // email confirmation is switched off in Supabase
  $('sentTo').textContent = 'We sent a verification code to ' + email + '. It may take a minute — check spam too.';
  $('stepForm').hidden = true; $('stepVerify').hidden = false; $('code').focus(); cooldown($('resend'));
};

$('verify').onclick = async () => {
  const code = $('code').value.replace(/\s/g, '');
  if (!/^\d{6,10}$/.test(code)) return flash(msg, 'Enter the numeric code from the email.');
  $('verify').disabled = true;
  const { error } = await AUTH.verify(email, code, 'signup');
  $('verify').disabled = false;
  if (error) return flash(msg, AUTH.friendly(error));
  done();
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('verify').click(); });
$('resend').onclick = async () => {
  if ($('resend').dataset.locked) return;
  const { error } = await AUTH.resend(email);
  if (error) return flash(msg, AUTH.friendly(error));
  flash(msg, 'New code sent.', 'ok'); cooldown($('resend'));
};
$('change').onclick = () => {
  $('stepVerify').hidden = true; $('stepForm').hidden = false; flash(msg, '');
};
</script>
</body></html>
