<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f7f1"/><stop offset=".5" stop-color="#eef0fc"/><stop offset="1" stop-color="#fdf0e6"/>
    </linearGradient>
    <radialGradient id="mint"><stop offset="0" stop-color="#19c39b" stop-opacity=".62"/><stop offset="1" stop-color="#19c39b" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#7c6cff" stop-opacity=".5"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sky"><stop offset="0" stop-color="#5bbcff" stop-opacity=".5"/><stop offset="1" stop-color="#5bbcff" stop-opacity="0"/></radialGradient>
    <radialGradient id="peach"><stop offset="0" stop-color="#ffab7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffab7a" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19c39b"/><stop offset="1" stop-color="#0b9a6d"/></linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a8cff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc08a"/><stop offset="1" stop-color="#ff8fa3"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b9a6d" fill-opacity=".16"/></pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
    <mask id="edges"><rect width="1600" height="900" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <circle cx="170" cy="60"  r="560" fill="url(#mint)"/>
  <circle cx="1480" cy="90" r="520" fill="url(#violet)"/>
  <circle cx="90"  cy="880" r="540" fill="url(#sky)"/>
  <circle cx="1500" cy="840" r="560" fill="url(#peach)"/>
  <circle cx="820" cy="450" r="300" fill="url(#mint)" opacity=".28"/>

  <rect width="1600" height="900" fill="url(#dots)" mask="url(#edges)"/>

  <!-- floating "app icon" tiles, kept near the edges so forms and cards stay clean -->
  <g stroke="#fff" stroke-opacity=".7" stroke-width="2">
    <rect x="96"   y="170" width="150" height="150" rx="38" fill="url(#tile1)" fill-opacity=".34" transform="rotate(-12 171 245)"/>
    <rect x="250"  y="560" width="96"  height="96"  rx="26" fill="url(#tile2)" fill-opacity=".30" transform="rotate(10 298 608)"/>
    <rect x="40"   y="640" width="64"  height="64"  rx="18" fill="url(#tile3)" fill-opacity=".34" transform="rotate(-8 72 672)"/>
    <rect x="1330" y="150" width="120" height="120" rx="32" fill="url(#tile2)" fill-opacity=".30" transform="rotate(14 1390 210)"/>
    <rect x="1440" y="520" width="150" height="150" rx="38" fill="url(#tile3)" fill-opacity=".32" transform="rotate(-10 1515 595)"/>
    <rect x="1230" y="700" width="84"  height="84"  rx="23" fill="url(#tile1)" fill-opacity=".30" transform="rotate(9 1272 742)"/>
    <rect x="720"  y="40"  width="70"  height="70"  rx="20" fill="url(#tile1)" fill-opacity=".22" transform="rotate(-6 755 75)"/>
  </g>
  <!-- tiny play triangles on two tiles -->
  <g fill="#fff" fill-opacity=".85">
    <path d="M150 215v70l60-35z" transform="rotate(-12 171 245)"/>
    <path d="M1478 560v70l60-35z" transform="rotate(-10 1515 595)"/>
  </g>
</svg>
