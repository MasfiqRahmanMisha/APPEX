<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer invites · Appex</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-root="../">
<div id="header"></div>
<main class="wrap">
  <h1 class="page">Developer invite links</h1>
  <p class="sub">Anyone who registers through an active link becomes a developer. One link can be shared with many people and stays valid until you disable it.</p>

  <div class="form-card wide" style="margin:0 0 24px;max-width:none">
    <div id="msg"></div>
    <div class="row2">
      <div><label>Label (optional)</label><input id="note" type="text" maxlength="80" placeholder="e.g. CSE batch 2023"></div>
      <div><label>Valid for</label>
        <select id="days"><option value="">No expiry (until I disable it)</option><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></div>
    </div>
    <div class="row2">
      <div><label>Maximum sign-ups (optional)</label><input id="max" type="number" min="1" placeholder="Unlimited"></div>
      <div></div>
    </div>
    <p style="margin-top:18px"><button class="btn" id="create">Create invite link</button></p>
    <div id="fresh" hidden>
      <label>Share this link with developers</label>
      <div style="display:flex;gap:8px"><input id="freshLink" type="text" readonly><button class="btn ghost" id="copyFresh">Copy</button></div>
    </div>
  </div>

  <div class="section-head"><h2>All links</h2></div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script>
const $ = id => document.getElementById(id), msg = $('msg');
const linkFor = t => new URL('../register.html', location.href).href + '?invite=' + t;
let rows = [];

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Link copied'); }
  catch (e) { prompt('Copy this link:', text); }
}
function status(r) {
  if (!r.is_active) return badge('rejected', 'Disabled');
  if (r.expires_at && new Date(r.expires_at) < new Date()) return badge('rejected', 'Expired');
  if (r.max_uses && Number(r.use_count) >= r.max_uses) return badge('pending', 'Full');
  return badge('approved', 'Active');
}

async function load() {
  const me = await requireRole(['admin']);
  renderHeader(me, 'invites');
  const { data, error } = await sb.rpc('admin_invites');
  if (error) return toast(error.message, 'err');
  rows = data;
  $('list').innerHTML = rows.length ? `<div class="tablewrap"><table>
    <tr><th>Label</th><th>Status</th><th>Joined</th><th>Created</th><th>Expires</th><th></th></tr>
    ${rows.map(r => `<tr>
      <td>${esc(r.note || '—')}</td><td>${status(r)}</td>
      <td>${fmtNum(r.use_count)}${r.max_uses ? ' / ' + fmtNum(r.max_uses) : ''}</td>
      <td>${fmtDate(r.created_at)}</td><td>${r.expires_at ? fmtDate(r.expires_at) : 'Never'}</td>
      <td><div class="actions"><button class="btn ghost small" onclick="copyRow('${r.id}')">Copy link</button>
        <button class="btn ${r.is_active ? 'danger' : ''} small" onclick="toggle('${r.id}', ${!r.is_active})">${r.is_active ? 'Disable' : 'Enable'}</button></div></td></tr>`).join('')}
    </table></div>` : '<p class="empty">No invite links yet.</p>';
}
function copyRow(id) { copy(linkFor(rows.find(r => r.id === id).token)); }

$('create').onclick = async () => {
  const days = $('days').value, max = $('max').value;
  $('create').disabled = true; flash(msg, '');
  const { data, error } = await sb.rpc('admin_create_invite', {
    p_note: $('note').value.trim() || null, p_days: days ? Number(days) : null, p_max_uses: max ? Number(max) : null });
  $('create').disabled = false;
  if (error) return flash(msg, error.message);
  $('freshLink').value = linkFor(data); $('fresh').hidden = false; $('note').value = '';
  copy(linkFor(data)); load();
};
$('copyFresh').onclick = () => copy($('freshLink').value);

async function toggle(id, flag) {
  if (!flag && !confirm('Disable this link? New people will not be able to join as developers with it. Existing developers keep their access.')) return;
  const { error } = await sb.rpc('admin_set_invite_active', { p_id: id, p_flag: flag });
  if (error) return toast(error.message, 'err');
  toast(flag ? 'Link enabled' : 'Link disabled'); load();
}
load();
</script>
</body></html>
